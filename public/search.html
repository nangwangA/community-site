<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>搜索 - 轻社区</title>
<link rel="stylesheet" href="/css/style.css">
<style>
.search-hero { text-align: center; padding: 48px 0 32px; }
.search-hero h1 { font-size: clamp(22px,4vw,32px); color: var(--primary); font-weight: 500; letter-spacing: 1px; }
.search-hero p { margin-top: 8px; color: var(--subtext); font-size: 14px; }

.search-box-wrap {
  max-width: 640px; margin: 0 auto 28px;
  display: flex; gap: 0;
  background: var(--card); border: 2px solid var(--line);
  border-radius: 999px; padding: 4px; box-shadow: var(--shadow);
  transition: border-color .2s;
}
.search-box-wrap:focus-within { border-color: var(--primary); }
.search-input {
  flex: 1; border: none; background: none; outline: none;
  font-size: 16px; padding: 12px 18px; color: var(--text);
}
.search-btn {
  background: var(--primary); color: #fff; border: none;
  border-radius: 999px; padding: 10px 24px; cursor: pointer;
  font-size: 15px; transition: all .2s; white-space: nowrap;
}
.search-btn:hover { transform: scale(1.03); box-shadow: 0 4px 14px rgba(63,83,104,.25); }

.hot-section { max-width: 800px; margin: 0 auto 30px; }
.hot-title { font-size: 15px; color: var(--primary); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.hot-tags { display: flex; flex-wrap: wrap; gap: 8px; }
.hot-tag {
  border: 1px solid var(--line); background: #f3f0ea;
  border-radius: 999px; padding: 7px 15px; font-size: 14px;
  color: var(--subtext); cursor: pointer; transition: all .2s;
}
.hot-tag:hover, .hot-tag.active { color: var(--primary); border-color: var(--primary); background: var(--primary-light); }

.history-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.history-title { font-size: 15px; color: var(--primary); }
.clear-hist { font-size: 13px; color: var(--subtext); cursor: pointer; background: none; border: none; }
.clear-hist:hover { color: var(--danger); }
.history-tags { display: flex; flex-wrap: wrap; gap: 8px; }
.hist-tag {
  border: 1px solid var(--line); background: #f3f0ea;
  border-radius: 999px; padding: 5px 13px; font-size: 13px;
  color: var(--subtext); cursor: pointer; transition: all .15s;
  display: flex; align-items: center; gap: 4px;
}
.hist-tag:hover { border-color: var(--danger); color: var(--danger); }
.hist-tag .del-x { font-size: 11px; opacity: .5; }

.filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; align-items: center; }
.filter-chip {
  border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 14px; font-size: 13px; cursor: pointer;
  background: #f3f0ea; color: var(--subtext); transition: all .15s;
}
.filter-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.filter-chip:hover:not(.active) { border-color: var(--primary); color: var(--primary); }

.result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.result-info { font-size: 14px; color: var(--subtext); }
.result-info b { color: var(--primary); }
.sort-btns { display: flex; gap: 6px; }
.sort-btn {
  border: 1px solid var(--line); border-radius: 999px;
  padding: 5px 12px; font-size: 12px; cursor: pointer;
  background: #fff; color: var(--subtext); transition: all .15s;
}
.sort-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

.result-card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 20px; margin-bottom: 14px;
  box-shadow: var(--shadow); cursor: pointer;
  transition: all .2s ease;
}
.result-card:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(55,70,85,.11); background: #fffdf9; }
.result-card h3 { font-size: 17px; color: #31465b; margin-bottom: 6px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.result-meta { font-size: 13px; color: var(--subtext); margin-bottom: 10px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.result-excerpt { font-size: 14px; color: #555; line-height: 1.7; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 10px; }
.hl { background: linear-gradient(120deg, rgba(176,137,104,.25) 0%, rgba(176,137,104,.15) 100%); border-radius: 2px; padding: 0 2px; }
.result-footer { display: flex; gap: 16px; font-size: 12px; color: var(--subtext); }
.result-cat { display: inline-block; padding: 3px 9px; border-radius: 999px; background: #f0ece5; font-size: 12px; color: #5f5b56; border: 1px solid var(--line); }

.empty-search { text-align: center; padding: 60px 20px; }
.empty-search-icon { font-size: 56px; margin-bottom: 14px; }
.empty-search h3 { color: var(--primary); font-size: 18px; margin-bottom: 8px; }
.empty-search p { color: var(--subtext); font-size: 14px; }

@media(max-width:600px) {
  .search-box-wrap { margin: 0 12px 20px; }
  .search-input { font-size: 14px; padding: 10px 14px; }
  .search-btn { padding: 8px 16px; font-size: 14px; }
}
</style>
</head>
<body>
<div id="app"></div>
<script src="/js/common.js"></script>
<script src="/js/nav.js"></script>
<script>
(async function() {
  currentUser = await checkLogin();
  let html = renderNavbar('search', currentUser);
  html += `<main class="main-layout"><div class="container">

<div class="search-hero">
  <h1>🔍 发现精彩内容</h1>
  <p>搜索文章、话题、作者，找到你感兴趣的内容</p>
</div>

<div class="search-box-wrap">
  <input type="text" class="search-input" id="searchInput" placeholder="输入关键词搜索文章..." autocomplete="off">
  <button class="search-btn" onclick="doSearch()">搜索</button>
</div>

<section class="hot-section" id="hotSection">
  <div class="history-row">
    <span class="history-title">🕐 搜索历史</span>
    <button class="clear-hist" onclick="clearHistory()">清空</button>
  </div>
  <div class="history-tags" id="historyTags"><span style="color:var(--subtext);font-size:13px;">暂无搜索记录</span></div>

  <div style="margin-top:24px;">
    <div class="hot-title">🔥 热门搜索</div>
    <div class="hot-tags" id="hotTags"></div>
  </div>
</section>

<section id="resultSection" style="display:none;max-width:800px;margin:0 auto;">
  <div class="filter-bar" id="filterBar"></div>
  <div class="result-header">
    <div class="result-info" id="resultInfo"></div>
    <div class="sort-btns">
      <button class="sort-btn active" data-sort="relevance" onclick="setSort('relevance',this)">相关度</button>
      <button class="sort-btn" data-sort="newest" onclick="setSort('newest',this)">最新发布</button>
      <button class="sort-btn" data-sort="popular" onclick="setSort('popular',this)">最多浏览</button>
    </div>
  </div>
  <div id="searchResults"></div>
</section>

</div></main>`;
  html += renderFooter();
  document.getElementById('app').innerHTML = html;

  const HIST_KEY = 'qingshe_search_history';
  const MAX_HIST = 10;
  const HOT_WORDS = ['日常', '治愈', '随笔', '旅行', '美食', '读书', '心情', '成长', '摄影', '杂谈'];

  const params = new URLSearchParams(window.location.search);
  const initKeyword = params.get('q') || '';
  let currentKeyword = '';
  let currentPage = 1;
  let currentSort = 'relevance';
  let categories = [];

  function getHistory() {
    try { return JSON.parse(localStorage.getItem(HIST_KEY)) || []; } catch(e) { return []; }
  }
  function saveHistory(word) {
    if (!word) return;
    let h = getHistory();
    h = h.filter(x => x !== word);
    h.unshift(word);
    if (h.length > MAX_HIST) h = h.length = MAX_HIST;
    try { localStorage.setItem(HIST_KEY, JSON.stringify(h)); } catch(e) {}
  }
  function clearHistory() {
    localStorage.removeItem(HIST_KEY);
    renderHistory();
    showToast('已清空搜索历史', 'info');
  }
  function removeHistItem(word) {
    let h = getHistory().filter(x => x !== word);
    try { localStorage.setItem(HIST_KEY, JSON.stringify(h)); } catch(e) {}
    renderHistory();
  }

  function renderHistory() {
    const h = getHistory();
    const el = document.getElementById('historyTags');
    if (!h.length) { el.innerHTML = '<span style="color:var(--subtext);font-size:13px;">暂无搜索记录</span>'; return; }
    el.innerHTML = h.map(w => `<span class="hist-tag" onclick="goSearch('${escapeAttr(w)}')">${escapeHtml(w)}<span class="del-x" onclick="event.stopPropagation();removeHistItem('${escapeAttr(w)}')">✕</span></span>`).join('');
  }

  function renderHotTags() {
    const el = document.getElementById('hotTags');
    el.innerHTML = HOT_WORDS.map(w => `<span class="hot-tag" onclick="goSearch('${w}')">${w}</span>`).join('');
  }

  window.goSearch = function(word) {
    document.getElementById('searchInput').value = word;
    doSearch();
  };

  async function loadCategories() {
    const res = await api('/categories');
    if (res.code === 200) categories = res.data;
  }

  function renderFilterBar() {
    const el = document.getElementById('filterBar');
    let h = `<span class="filter-chip active" data-cat="" onclick="setCategory('',this)">全部分类</span>`;
    for (const c of categories) {
      h += `<span class="filter-chip" data-cat="${c.id}" onclick="setCategory(${c.id},this)">${escapeHtml(c.name)}</span>`;
    }
    el.innerHTML = h;
  }

  let currentCat = '';
  window.setCategory = function(id, btn) {
    currentCat = String(id);
    document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentPage = 1;
    loadResults();
  };
  window.setSort = function(sort, btn) {
    currentSort = sort;
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentPage = 1;
    loadResults();
  };

  function highlightText(text, keyword) {
    if (!keyword || !text) return escapeHtml(text || '');
    const escaped = escapeHtml(text);
    const k = escapeHtml(keyword).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp(k, 'gi');
    return escaped.replace(re, m => `<span class="hl">${m}</span>`);
  }

  async function doSearch() {
    currentKeyword = document.getElementById('searchInput').value.trim();
    if (!currentKeyword) { showToast('请输入搜索关键词', 'warning'); return; }
    saveHistory(currentKeyword);
    renderHistory();
    currentPage = 1;
    window.history.replaceState(null, '', '?q=' + encodeURIComponent(currentKeyword));
    document.getElementById('hotSection').style.display = 'none';
    document.getElementById('resultSection').style.display = 'block';
    await loadCategories();
    renderFilterBar();
    loadResults();
  }
  window.doSearch = doSearch;

  async function loadResults() {
    const el = document.getElementById('searchResults');
    showLoading(el);
    let url = `/articles/search?page=${currentPage}&pageSize=10&keyword=${encodeURIComponent(currentKeyword)}`;
    if (currentCat) url += `&category_id=${currentCat}`;
    if (currentSort === 'newest') url += '&sort=newest';
    else if (currentSort === 'popular') url += '&sort=view_count';
    const res = await api(url);

    if (res.code !== 200) {
      hideLoading(el, `<div class="empty-search"><div class="empty-search-icon">😵</div><h3>搜索出错</h3><p>${res.message}</p></div>`);
      return;
    }

    const { list, pagination } = res.data;
    document.getElementById('resultInfo').innerHTML = `找到 <b>${pagination.total}</b> 条关于 "<b>${escapeHtml(currentKeyword)}</b>" 的结果`;

    if (!list.length) {
      hideLoading(el, `<div class="empty-search"><div class="empty-search-icon">🔍</div><h3>未找到相关内容</h3><p>试试其他关键词或换个分类筛选</p></div>`);
      return;
    }

    let h = '';
    for (const a of list) {
      h += `<div class="result-card" onclick="location.href='/article.html?id=${a.id}'">
        <h3>${highlightText(a.title, currentKeyword)}</h3>
        <div class="result-meta">
          <span>${escapeHtml(a.author_name || '匿名')}</span>
          <span>${formatDate(a.published_at || a.created_at)}</span>
          ${a.category_name ? `<span class="result-cat">${escapeHtml(a.category_name)}</span>` : ''}
        </div>
        <div class="result-excerpt">${highlightText(a.summary || '暂无摘要', currentKeyword)}</div>
        <div class="result-footer">
          <span>👁 ${a.view_count || 0} 浏览</span>
          <span>❤️ ${a.like_count || 0} 点赞</span>
          <span>💬 ${a.comment_count || 0} 评论</span>
        </div>
      </div>`;
    }

    const totalP = Math.ceil(pagination.total / pagination.pageSize);
    if (totalP > 1) {
      h += '<div class="pagination">';
      if (currentPage > 1) h += `<a href="#" data-p="${currentPage-1}">‹ 上一页</a>`;
      let start = Math.max(1, currentPage - 2), end = Math.min(totalP, start + 4);
      if (end - start < 4) start = Math.max(1, end - 4);
      for (let i = start; i <= end; i++) h += i === currentPage ? `<span class="active">${i}</span>` : `<a href="#" data-p="${i}">${i}</a>`;
      if (currentPage < totalP) h += `<a href="#" data-p="${currentPage+1}">下一页 ›</a>`;
      h += '</div>';
      setTimeout(() => {
        document.querySelectorAll('.pagination a[data-p]').forEach(a => {
          a.onclick = e => { e.preventDefault(); currentPage = parseInt(a.dataset.p); loadResults(); window.scrollTo({ top: 300, behavior: 'smooth' }); };
        });
      }, 50);
    }

    hideLoading(el, h);
  }

  document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

  renderHistory();
  renderHotTags();

  if (initKeyword) {
    document.getElementById('searchInput').value = initKeyword;
    doSearch();
  } else {
    await loadCategories();
  }
})();
</script>
</body>
</html>
